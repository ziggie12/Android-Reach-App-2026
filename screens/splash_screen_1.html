<body class="bg-surface text-on-surface h-screen w-screen overflow-hidden flex flex-col items-center justify-center relative bg-gradient-to-br from-surface to-primary-fixed">
<!-- Splash Screen Canvas (Navigation Suppressed as per Linear/Transactional Rule) -->
<main class="flex-1 w-full flex flex-col items-center justify-center z-10 px-margin-mobile">
<!-- Brand Centerpiece -->
<div class="flex flex-col items-center gap-lg">
<!-- Logo Icon / Representation -->
<div class="w-32 h-32 rounded-xl bg-primary flex items-center justify-center shadow-lg shadow-primary/20 relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-tr from-tertiary to-primary opacity-80"></div>
<span class="material-symbols-outlined text-on-primary text-[64px] z-10" style="font-variation-settings: 'FILL' 1;">
                    local_shipping
                </span>
</div>
<!-- Brand Text -->
<div class="text-center">
<h1 class="font-display-lg text-display-lg text-primary tracking-tighter">Munandy Reach</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-sm">Logistics &amp; Fleet Management</p>
</div>
</div>
</main>
<!-- Bottom Loading Indicator Area -->
<div class="absolute bottom-12 left-0 w-full flex flex-col items-center justify-center z-10">
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
<div class="w-2 h-2 rounded-full bg-primary animate-pulse" style="animation-delay: 0.2s"></div>
<div class="w-2 h-2 rounded-full bg-primary animate-pulse" style="animation-delay: 0.4s"></div>
</div>

</div>
