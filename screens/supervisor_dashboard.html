<body class="bg-background text-on-background font-body-md min-h-screen pt-[64px] pb-[80px]">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 h-16 bg-white dark:bg-slate-950 border-b border-slate-200 dark:border-slate-800 flat no shadows transition-colors duration-200">
<button class="w-[48px] h-[48px] flex items-center justify-center text-blue-900 dark:text-blue-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors duration-200 active:opacity-70">
<span class="material-symbols-outlined text-[24px]">menu</span>
</button>
<h1 class="font-['Inter'] text-base font-semibold tracking-tight text-blue-900 dark:text-blue-400 text-lg font-black tracking-tighter">Supervisor Dashboard</h1>
<div class="w-[48px] h-[48px] flex items-center justify-center hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors duration-200 active:opacity-70">
<img alt="User profile photo" class="w-8 h-8 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuATwg26xNZpvD-39Xhw3EdGjrg6R3MLgLvnfXQwwa6KGjURDOkLYMLbo29jy1x_qB6WxCx1tPdjqx26QXr5QQ0axqo83S1UpPhz6-41z8MD44DYPARmxaYX_k5HOmDoxyvF6jYRaD_y8zpDeude_buwv9aJBQNbF2DGT7biK5_avDcFtMTisCsAPbEqLJnHSy2INZaSkTwMSmfVKiHrDmNhK_4DncsbmwFf4lBlCV2uDmhEo-nSOiVV9-lzQwvPkUXjuRqc1u0nMVs"/>
</div>
</header>
<!-- Main Content -->
<main class="max-w-7xl mx-auto p-margin-mobile md:p-lg flex flex-col gap-lg">
<!-- Summary Dashboard (Bento Grid Style) -->
<section class="grid grid-cols-1 md:grid-cols-3 gap-md">
<!-- Team Active Routes -->
<div class="bg-surface-container-lowest border border-outline-variant/30 rounded-xl p-md flex flex-col justify-between h-[160px] hover:border-primary transition-colors cursor-pointer group">
<div class="flex justify-between items-start">
<span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">route</span>
<span class="bg-primary-fixed text-on-primary-fixed font-label-md px-2 py-1 rounded-full">Live</span>
</div>
<div>
<h2 class="font-display-lg text-on-background group-hover:text-primary transition-colors">5</h2>
<p class="font-label-lg text-on-surface-variant">My Team's Active Routes</p>
</div>
</div>
<!-- Stops Done Today -->
<div class="bg-surface-container-lowest border border-outline-variant/30 rounded-xl p-md flex flex-col justify-between h-[160px] hover:border-primary transition-colors cursor-pointer group">
<div class="flex justify-between items-start">
<span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">done_all</span>
<span class="bg-surface-variant text-on-surface-variant font-label-md px-2 py-1 rounded-full">Today</span>
</div>
<div>
<h2 class="font-display-lg text-on-background group-hover:text-primary transition-colors">20</h2>
<p class="font-label-lg text-on-surface-variant">Stops Done Today</p>
</div>
</div>
<!-- Territory Customers -->
<div class="bg-surface-container-lowest border border-outline-variant/30 rounded-xl p-md flex flex-col justify-between h-[160px] hover:border-primary transition-colors cursor-pointer group">
<div class="flex justify-between items-start">
<span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">groups</span>
<span class="bg-surface-variant text-on-surface-variant font-label-md px-2 py-1 rounded-full">Total</span>
</div>
<div>
<h2 class="font-display-lg text-on-background group-hover:text-primary transition-colors">150</h2>
<p class="font-label-lg text-on-surface-variant">Territory Customers</p>
</div>
</div>
</section>
<!-- Quick Links -->
<section>
<h3 class="font-title-lg text-on-background mb-md">Quick Actions</h3>
<div class="grid grid-cols-1 sm:grid-cols-3 gap-md">
<button class="min-h-[48px] bg-primary text-on-primary font-label-lg rounded-DEFAULT px-md py-sm flex items-center justify-center gap-sm hover:bg-primary/90 transition-colors active:scale-95 shadow-sm">
<span class="material-symbols-outlined">manage_accounts</span>
                    Customer Management
                </button>
<button class="min-h-[48px] bg-primary text-on-primary font-label-lg rounded-DEFAULT px-md py-sm flex items-center justify-center gap-sm hover:bg-primary/90 transition-colors active:scale-95 shadow-sm">
<span class="material-symbols-outlined">add_road</span>
                    Route Builder
                </button>
<button class="min-h-[48px] bg-primary text-on-primary font-label-lg rounded-DEFAULT px-md py-sm flex items-center justify-center gap-sm hover:bg-primary/90 transition-colors active:scale-95 shadow-sm">
<span class="material-symbols-outlined">my_location</span>
                    Live Tracking
                </button>
</div>
</section>

<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pb-safe bg-surface h-20 bg-white dark:bg-slate-950 border-t border-slate-200 dark:border-slate-800 shadow-lg dark:shadow-none md:hidden">
<!-- Dashboard (Active) -->
<button class="flex flex-col items-center justify-center bg-blue-100 dark:bg-blue-900/40 text-blue-900 dark:text-blue-100 rounded-2xl px-4 py-1 active:scale-95 transition-transform duration-150 ease-in-out font-['Inter'] text-[12px] font-medium min-h-[48px] min-w-[48px]">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">dashboard</span>
<span>Dashboard</span>
</button>
<!-- Routes -->
<button class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 px-4 py-1 hover:text-blue-800 dark:hover:text-blue-300 active:scale-95 transition-transform duration-150 ease-in-out font-['Inter'] text-[12px] font-medium min-h-[48px] min-w-[48px]">
<span class="material-symbols-outlined mb-1">route</span>
<span>Routes</span>
</button>
<!-- Customers -->

</button>

<span class="material-symbols-outlined mb-1">distance</span>
<span>Tracking</span>
</button>
<!-- Profile -->
<button class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 px-4 py-1 hover:text-blue-800 dark:hover:text-blue-300 active:scale-95 transition-transform duration-150 ease-in-out font-['Inter'] text-[12px] font-medium min-h-[48px] min-w-[48px]">
<span class="material-symbols-outlined mb-1">person</span>
<span>Profile</span>
</button>
</nav>
