<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Munandy Drive - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "surface-dim": "#dbdad9",
                        "primary-fixed-dim": "#b0c6ff",
                        "outline": "#737783",
                        "outline-variant": "#c3c6d4",
                        "secondary-container": "#da3433",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e3e2e2",
                        "on-primary-container": "#a1bbff",
                        "tertiary-fixed-dim": "#a5c8ff",
                        "inverse-primary": "#b0c6ff",
                        "secondary": "#b6171e",
                        "surface-variant": "#e3e2e2",
                        "on-error": "#ffffff",
                        "secondary-fixed": "#ffdad6",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f5f3f3",
                        "surface-container-high": "#e9e8e7",
                        "on-background": "#1b1c1c",
                        "on-primary-fixed": "#001945",
                        "primary": "#003178",
                        "on-secondary-fixed-variant": "#930010",
                        "on-primary-fixed-variant": "#00429c",
                        "on-tertiary-fixed": "#001c3a",
                        "surface": "#fbf9f9",
                        "on-surface": "#1b1c1c",
                        "background": "#fbf9f9",
                        "tertiary": "#003567",
                        "inverse-on-surface": "#f2f0f0",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#303031",
                        "primary-fixed": "#d9e2ff",
                        "on-surface-variant": "#434652",
                        "surface-container": "#efeded",
                        "surface-tint": "#2b5bb5",
                        "on-secondary-fixed": "#410003",
                        "surface-bright": "#fbf9f9",
                        "on-secondary-container": "#fffbff",
                        "primary-container": "#0d47a1",
                        "tertiary-container": "#004c8e",
                        "on-tertiary-container": "#93beff",
                        "on-tertiary-fixed-variant": "#004786",
                        "on-error-container": "#93000a",
                        "secondary-fixed-dim": "#ffb3ac",
                        "tertiary-fixed": "#d4e3ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "lg": "24px",
                        "tap-target-min": "48px",
                        "margin-mobile": "16px",
                        "sm": "8px",
                        "baseline": "8px",
                        "gutter-mobile": "16px",
                        "xs": "4px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "title-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "title-lg": ["22px", { "lineHeight": "28px", "letterSpacing": "0px", "fontWeight": "500" }],
                        "headline-md": ["28px", { "lineHeight": "36px", "letterSpacing": "0px", "fontWeight": "600" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400" }],
                        "display-lg": ["57px", { "lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile antialiased">
<!-- Main Container -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant/30 overflow-hidden relative z-10">
<!-- Header Section -->
<div class="px-lg pt-xl pb-md text-center bg-surface flex flex-col items-center">
<!-- Brand Logo -->
<div class="w-16 h-16 bg-primary-container text-on-primary-container rounded-lg flex items-center justify-center mb-md shadow-sm">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">local_shipping</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary mb-xs">Munandy Drive</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to your logistics dashboard</p>
</div>
<!-- Content Section -->
<div class="p-lg">
<!-- Error State Placeholder (Hidden by default, shown for demonstration structure) -->
<!-- To show error, remove 'hidden' class -->
<div class="hidden bg-error-container text-on-error-container p-sm rounded-DEFAULT mb-md flex items-start gap-sm border border-error/20">
<span class="material-symbols-outlined shrink-0 text-[20px] mt-xs">error</span>
<p class="font-body-md text-body-md font-medium">Invalid Credentials. Please check your email and password.</p>
</div>
<form action="{{DATA:SCREEN:SCREEN_10}}" class="flex flex-col gap-md">
<!-- Email Field (MD3 Outlined Style) -->
<div class="relative">
<input autocomplete="email" class="block w-full min-h-[56px] px-md pt-6 pb-2 text-on-surface bg-transparent border border-outline rounded-DEFAULT appearance-none focus:outline-none focus:ring-0 focus:border-primary focus:border-2 peer font-body-lg text-body-lg" id="email" name="email" placeholder=" " required="" type="email"/>
<label class="absolute text-on-surface-variant duration-200 transform -translate-y-4 scale-75 top-4 z-10 origin-[0] left-md peer-focus:text-primary peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-4 font-body-lg text-body-lg bg-surface-container-lowest px-1" for="email">
                        Email Address
                    </label>
</div>
<!-- Password Field (MD3 Outlined Style) -->
<div class="relative">
<input autocomplete="current-password" class="block w-full min-h-[56px] px-md pt-6 pb-2 text-on-surface bg-transparent border border-outline rounded-DEFAULT appearance-none focus:outline-none focus:ring-0 focus:border-primary focus:border-2 peer font-body-lg text-body-lg" id="password" name="password" placeholder=" " required="" type="password"/>
<label class="absolute text-on-surface-variant duration-200 transform -translate-y-4 scale-75 top-4 z-10 origin-[0] left-md peer-focus:text-primary peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-4 font-body-lg text-body-lg bg-surface-container-lowest px-1" for="password">
                        Password
                    </label>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface focus:outline-none h-tap-target-min w-tap-target-min flex items-center justify-center rounded-full hover:bg-surface-variant/50 transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-xs">
<a class="font-label-lg text-label-lg text-primary hover:text-primary-container hover:underline focus:outline-none focus:underline min-h-[24px] flex items-center" href="#">
                        Forgot Password?
                    </a>
</div>
<!-- Submit Button -->
<button class="mt-sm w-full min-h-[48px] bg-primary text-on-primary rounded-full font-label-lg text-label-lg flex items-center justify-center gap-sm hover:bg-primary-container hover:shadow-md transition-all duration-200 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary" type="submit">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">login</span>
                    Sign In
                </button>
<!-- Demo Quick Links -->
<div class="flex justify-center items-center gap-sm mt-md font-body-md text-body-md">
<a class="text-primary hover:underline" href="{{DATA:SCREEN:SCREEN_15}}">Admin Demo</a>
<span class="text-outline-variant text-xs">•</span>
<a class="text-primary hover:underline" href="{{DATA:SCREEN:SCREEN_4}}">Salesman Demo</a>
</div>
</form>
</div>
<!-- Subtle Bottom Decor -->
<div class="h-2 w-full bg-surface-variant mt-auto"></div>
</main>
</body></html>
